name: Deploy Cloudflare E2E Trigger Worker

on:
  push:
    branches: [main, development]
    paths:
      - cloudflare/e2e-trigger-worker/**
      - .github/workflows/deploy-cloudflare-e2e-trigger.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/e2e-trigger-worker
          command: deploy
